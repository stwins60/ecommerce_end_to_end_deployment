apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-app-config
  namespace: NAMESPACE
data:
  DATABASE_URL: postgresql://postgres:postgres@postgres-service.postgres-ns.svc.cluster.local:5432/ecommercedb
  FLASK_ENV: ENVIRONMENT

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  namespace: NAMESPACE
spec:
  selector:
    matchLabels:
      app: ecommerce-app
  template:
    metadata:
      labels:
        app: ecommerce-app
    spec:
      containers:
      - name: ecommerce-app
        image: idrisniyi94/ecommerce_demo:IMAGE_TAG
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 5000
      envFrom:
      - configMapRef:
        name: ecommerce-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-svc
  namespace: NAMESPACE
spec:
  selector:
    app: ecommerce-app
  ports:
  - port: 5000
    targetPort: 5000
  type: NodePort

